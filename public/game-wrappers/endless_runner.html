<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>DINO RUN!</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: linear-gradient(180deg,#87ceeb 0%,#b8f0a8 100%);
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    min-height:100vh;
    font-family:'Fredoka One',cursive;
    overflow:hidden;
  }
  #title { font-size:36px; color:#2e7d32; text-shadow:3px 3px 0 #fff,5px 5px 0 #a5d6a7; margin-bottom:8px; }
  #hud { display:flex; gap:28px; font-size:20px; color:#1b5e20; background:white; padding:5px 24px; border-radius:50px; box-shadow:0 4px 0 #a5d6a7; margin-bottom:10px; }
  canvas { border-radius:22px; border:5px solid #fff; box-shadow:0 8px 32px rgba(0,0,0,0.15); display:block; touch-action: none; }
  #hint { margin-top:12px; font-size:14px; color:#2e7d32; opacity:0.8; }
  #overlay { position:absolute; top:0;left:0;width:100%;height:100%; background:rgba(255,255,255,0.9); display:flex; flex-direction:column; align-items:center; justify-content:center; border-radius:18px; gap:14px; }
  #overlay h2 { font-size:32px; color:#2e7d32; }
  #overlay .sub { font-size:16px; color:#1565c0; animation:blink 1s step-end infinite; }
  #overlay .sc { font-size:20px; color:#e65100; }
  @keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
</style>
</head>
<body>
<div id="title">🦕 DINO RUN!</div>
<div id="hud">
  <span>⭐ <span id="score">0</span></span>
  <span>🏆 <span id="best">0</span></span>
</div>
<div style="position:relative">
  <canvas id="c"></canvas>
  <div id="overlay">
    <h2>🦕 DINO RUN!</h2>
    <div class="sub">TAP TO JUMP!<br>DOUBLE TAP = DOUBLE JUMP</div>
  </div>
</div>
<div id="hint">TAP SCREEN TO JUMP</div>
<script>
function rRect(ctx2, x, y, w, h, r) {
  r = Math.min(r, w/2, h/2);
  ctx2.beginPath();
  ctx2.moveTo(x + r, y);
  ctx2.lineTo(x + w - r, y);
  ctx2.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx2.lineTo(x + w, y + h - r);
  ctx2.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx2.lineTo(x + r, y + h);
  ctx2.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx2.lineTo(x, y + r);
  ctx2.quadraticCurveTo(x, y, x + r, y);
  ctx2.closePath();
}
const c=document.getElementById('c'),ctx=c.getContext('2d');
const overlay=document.getElementById('overlay');
const scoreEl=document.getElementById('score'),bestEl=document.getElementById('best');
const W=Math.min(window.innerWidth-48,400), H=Math.round(W*1.35);
c.width=W; c.height=H;
c.style.touchAction = 'none';
const GY=H-Math.round(H*0.15);
let state='idle',score=0,best=0,frame=0,speed=0;
let dino={x:W*0.18,y:GY,w:W*0.1,h:W*0.13,dy:0,jumps:0,step:0};
let obs=[], obTimer=0;
let clouds=Array.from({length:4},(_,i)=>({x:i*(W/3)+W*0.1,y:H*0.08+Math.random()*H*0.1,r:W*0.06+Math.random()*W*0.04,spd:0.5+Math.random()*0.3}));
let groundX=0;
function jump(){
  if(dino.jumps<2){
    dino.dy=-(H*0.028+dino.jumps*H*0.005);
    dino.jumps++;
  }
}
function startGame(){
  score=0;frame=0;speed=W*0.012;
  dino.y=GY;dino.dy=0;dino.jumps=0;
  obs=[];obTimer=50;
  state='playing';overlay.style.display='none';
  scoreEl.textContent='0';
}
function gameOver(){
  state='over';
  if(score>best){best=score;bestEl.textContent=best;}
  overlay.innerHTML=`<h2>💥 Game Over!</h2><div class="sc">Score: ${score}</div>${score>=best&&score>0?'<div class="sc" style="color:#f9a825">🌟 New Best!</div>':''}<div class="sub">Tap to Try Again</div>`;
  overlay.style.display='flex';
}
c.addEventListener('touchstart',e=>{
  e.preventDefault();
  if(state!=='playing'){startGame();return;}
  jump();
},{passive:false});
c.addEventListener('click',()=>{
  if(state!=='playing'){startGame();return;}
  jump();
});
const DINO_BODY='#4caf50', DINO_EYE='#fff', DINO_PUPIL='#1b5e20', DINO_BELLY='#a5d6a7';
function drawDino(x,y,w,h,step){
  const bx=Math.round(x-w/2), by=Math.round(y-h);
  ctx.fillStyle=DINO_BODY;
  rRect(ctx, bx,by+h*0.2,w,h*0.65,w*0.3); ctx.fill();
  rRect(ctx, bx+w*0.2,by,w*0.75,h*0.45,w*0.25); ctx.fill();
  rRect(ctx, bx-w*0.2,by+h*0.4,w*0.28,h*0.2,6); ctx.fill();
  ctx.fillStyle=DINO_BELLY;
  ctx.beginPath(); ctx.ellipse(bx+w*0.38,by+h*0.52,w*0.22,h*0.18,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle=DINO_EYE;
  ctx.beginPath(); ctx.arc(bx+w*0.78,by+h*0.12,w*0.12,0,Math.PI*2); ctx.fill();
  ctx.fillStyle=DINO_PUPIL;
  ctx.beginPath(); ctx.arc(bx+w*0.8,by+h*0.13,w*0.065,0,Math.PI*2); ctx.fill();
  const legOff=dino.jumps>0?0:Math.sin(step*0.4)*h*0.08;
  ctx.fillStyle=DINO_BODY;
  rRect(ctx, bx+w*0.22,by+h*0.78+legOff,w*0.2,h*0.22-legOff,6); ctx.fill();
  rRect(ctx, bx+w*0.52,by+h*0.78-legOff,w*0.2,h*0.22+legOff,6); ctx.fill();
}
function drawCactus(ox,ow,oh){
  ctx.fillStyle='#e53935';
  rRect(ctx, Math.round(ox+ow*0.35),Math.round(GY-oh),ow*0.3,oh,6); ctx.fill();
  rRect(ctx, Math.round(ox),Math.round(GY-oh*0.7),ow*0.35,oh*0.16,5); ctx.fill();
  rRect(ctx, Math.round(ox+ow*0.3),Math.round(GY-oh*0.85),ow*0.1,oh*0.22,5); ctx.fill();
  rRect(ctx, Math.round(ox+ow*0.65),Math.round(GY-oh*0.65),ow*0.35,oh*0.16,5); ctx.fill();
  rRect(ctx, Math.round(ox+ow*0.6),Math.round(GY-oh*0.78),ow*0.1,oh*0.22,5); ctx.fill();
}
function update(){
  if(state!=='playing')return;
  frame++;
  score=Math.floor(frame/8);
  scoreEl.textContent=score;
  speed=W*0.012+score*0.0006;
  dino.dy+=H*0.0016;
  dino.y+=dino.dy;
  if(dino.y>=GY){dino.y=GY;dino.dy=0;dino.jumps=0;}
  if(dino.y<GY){}else dino.step++;
  clouds.forEach(cl=>{cl.x-=cl.spd*(speed/4);if(cl.x+cl.r*2<0)cl.x=W+cl.r;});
  groundX=(groundX-speed)%40;
  obTimer--;
  if(obTimer<=0){
    const oh=H*0.08+Math.random()*H*0.1, ow=W*0.08+Math.random()*W*0.06;
    obs.push({x:W+ow,w:ow,h:oh});
    obTimer=Math.max(40,80-Math.floor(score/30)*4)+Math.random()*30;
  }
  obs.forEach(o=>o.x-=speed);
  obs=obs.filter(o=>o.x+o.w>0);
  const dx=dino.x-dino.w/2, dy=dino.y-dino.h;
  obs.forEach(o=>{
    if(dx+dino.w*0.7>o.x+o.w*0.1 && dx+dino.w*0.15<o.x+o.w*0.9 && dy+dino.h*0.85>GY-o.h)
      gameOver();
  });
}
function draw(){
  const sky=ctx.createLinearGradient(0,0,0,GY);
  sky.addColorStop(0,'#4fc3f7'); sky.addColorStop(1,'#b3e5fc');
  ctx.fillStyle=sky; ctx.fillRect(0,0,W,GY);
  clouds.forEach(cl=>{
    ctx.fillStyle='rgba(255,255,255,0.85)';
    ctx.beginPath(); ctx.arc(cl.x,cl.y,cl.r,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(cl.x+cl.r*0.9,cl.y+cl.r*0.2,cl.r*0.7,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(cl.x-cl.r*0.7,cl.y+cl.r*0.15,cl.r*0.6,0,Math.PI*2); ctx.fill();
  });
  ctx.fillStyle='#ffd600';
  ctx.beginPath(); ctx.arc(W*0.88,H*0.07,W*0.065,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#66bb6a';
  ctx.fillRect(0,GY,W,H-GY);
  ctx.fillStyle='#81c784';
  ctx.fillRect(0,GY,W,8);
  ctx.fillStyle='rgba(255,255,255,0.18)';
  for(let x=groundX;x<W;x+=40) ctx.fillRect(x,GY+4,24,3);
  obs.forEach(o=>drawCactus(o.x,o.w,o.h));
  drawDino(dino.x,dino.y,dino.w,dino.h,dino.step);
  if(state==='playing'&&score>0&&score%50===0&&frame%8<4){
    ctx.fillStyle='rgba(255,214,0,0.7)';
    ctx.font=`bold ${W*0.06}px Fredoka One`;
    ctx.textAlign='center';
    ctx.fillText('⭐ +50!',W/2,H*0.25);
    ctx.textAlign='left';
  }
}
function loop(){update();draw();requestAnimationFrame(loop);}
loop();
</script>
</body>
</html>
