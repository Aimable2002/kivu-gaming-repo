<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>BLOCK PARTY!</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: linear-gradient(160deg,#fce4ec 0%,#e8f5e9 50%,#e3f2fd 100%);
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    min-height:100vh;
    font-family:'Fredoka One',cursive;
    overflow:hidden;
  }
  #title { font-size:30px; color:#6a1b9a; text-shadow:3px 3px 0 #fff,5px 5px 0 #ce93d8; margin-bottom:6px; }
  #top-hud { display:flex; gap:14px; margin-bottom:8px; }
  .hud-box { background:white; border-radius:16px; padding:5px 14px; box-shadow:0 4px 0 #ce93d8; text-align:center; }
  .hud-label { font-size:9px; color:#ab47bc; }
  .hud-val { font-size:20px; color:#4a148c; }
  #main { display:flex; gap:10px; align-items:flex-start; }
  canvas { border-radius:18px; border:4px solid #fff; box-shadow:0 8px 28px rgba(0,0,0,0.15); display:block; }
  #side { display:flex; flex-direction:column; gap:10px; }
  .side-box { background:white; border-radius:16px; padding:8px 10px; box-shadow:0 4px 0 #b0bec5; width:80px; }
  .side-label { font-size:9px; color:#78909c; margin-bottom:4px; }
  #overlay { position:absolute; top:0;left:0;width:100%;height:100%; background:rgba(255,255,255,0.92); display:flex; flex-direction:column; align-items:center; justify-content:center; border-radius:14px; gap:12px; z-index:10; }
  #overlay h2 { font-size:28px; color:#6a1b9a; }
  #overlay .sub { font-size:13px; color:#1565c0; animation:blink 1s step-end infinite; text-align:center; line-height:1.9; }
  #overlay .sc { font-size:18px; color:#e65100; }
  #controls { display:flex; gap:8px; margin-top:8px; flex-wrap:wrap; justify-content:center; }
  .btn {
    background:white; border:none; border-radius:16px;
    font-family:'Fredoka One',cursive; font-size:20px;
    padding:10px 18px; box-shadow:0 5px 0 #b0bec5;
    cursor:pointer; color:#333; transition:transform 0.08s,box-shadow 0.08s;
    -webkit-tap-highlight-color:transparent; touch-action: manipulation;
  }
  .btn:active { transform:translateY(3px); box-shadow:0 2px 0 #b0bec5; }
  @keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
  #flash { position:absolute; top:0;left:0;width:100%;height:100%; pointer-events:none; border-radius:14px; opacity:0; transition:opacity 0.08s; background:rgba(255,255,255,0.6); }
</style>
</head>
<body>
<div id="title">🧱 BLOCK PARTY!</div>
<div id="top-hud">
  <div class="hud-box"><div class="hud-label">SCORE</div><div class="hud-val" id="score">0</div></div>
  <div class="hud-box"><div class="hud-label">LINES</div><div class="hud-val" id="lines">0</div></div>
  <div class="hud-box"><div class="hud-label">LEVEL</div><div class="hud-val" id="level">1</div></div>
</div>
<div id="main">
  <div style="position:relative">
    <canvas id="c"></canvas>
    <div id="flash"></div>
    <div id="overlay">
      <h2>🧱 BLOCK PARTY!</h2>
      <div class="sub">TAP TO START!<br><br>← → BUTTONS = MOVE<br>🔄 = ROTATE &nbsp; ⬇️ = DROP</div>
    </div>
  </div>
  <div id="side">
    <div class="side-box">
      <div class="side-label">NEXT</div>
      <canvas id="nc" width="68" height="60"></canvas>
    </div>
  </div>
</div>
<div id="controls">
  <button class="btn" id="bleft">⬅️</button>
  <button class="btn" id="brot">🔄</button>
  <button class="btn" id="bdrop">⬇️</button>
  <button class="btn" id="bright">➡️</button>
</div>
<script>
function rRect(ctx2, x, y, w, h, r) {
  r = Math.min(r, w/2, h/2);
  ctx2.beginPath();
  ctx2.moveTo(x + r, y);
  ctx2.lineTo(x + w - r, y);
  ctx2.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx2.lineTo(x + w, y + h - r);
  ctx2.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx2.lineTo(x + r, y + h);
  ctx2.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx2.lineTo(x, y + r);
  ctx2.quadraticCurveTo(x, y, x + r, y);
  ctx2.closePath();
}
const c=document.getElementById('c'),ctx=c.getContext('2d');
const nc=document.getElementById('nc'),nctx=nc.getContext('2d');
const overlay=document.getElementById('overlay');
const flash=document.getElementById('flash');
const scoreEl=document.getElementById('score'),linesEl=document.getElementById('lines'),levelEl=document.getElementById('level');
const COLS=10, ROWS=20;
const CW=Math.min(Math.floor((window.innerWidth-110)/COLS)*COLS, 200);
const SZ=CW/COLS;
const CH=SZ*ROWS;
c.width=CW; c.height=CH;
const COLORS=['#ef5350','#ff9800','#fdd835','#66bb6a','#29b6f6','#5c6bc0','#ab47bc'];
const PIECES=[
  {s:[[1,1,1,1]],c:COLORS[4]},
  {s:[[1,1],[1,1]],c:COLORS[2]},
  {s:[[0,1,0],[1,1,1]],c:COLORS[5]},
  {s:[[1,1,0],[0,1,1]],c:COLORS[1]},
  {s:[[0,1,1],[1,1,0]],c:COLORS[3]},
  {s:[[1,0,0],[1,1,1]],c:COLORS[0]},
  {s:[[0,0,1],[1,1,1]],c:COLORS[6]},
];
let state='idle', board, score, lines, level;
let cur, curX, curY, nxt;
let dropTimer=0, dropInterval=800;
function mkBoard(){return Array.from({length:ROWS},()=>new Array(COLS).fill(null));}
function rndPiece(){const p=PIECES[Math.floor(Math.random()*PIECES.length)];return{s:p.s.map(r=>[...r]),c:p.c};}
function start(){
  board=mkBoard(); score=0; lines=0; level=1;
  dropTimer=0; dropInterval=800;
  nxt=rndPiece(); spawn();
  state='playing'; overlay.style.display='none';
  updateHUD();
}
function spawn(){
  cur=nxt; nxt=rndPiece();
  curX=Math.floor(COLS/2)-Math.floor(cur.s[0].length/2);
  curY=0;
  if(!canPlace(cur.s,curX,curY)) gameOver();
  drawNext();
}
function canPlace(s,ox,oy){
  for(let r=0;r<s.length;r++)
    for(let col=0;col<s[r].length;col++){
      if(!s[r][col])continue;
      const nx=ox+col,ny=oy+r;
      if(nx<0||nx>=COLS||ny>=ROWS)return false;
      if(ny>=0&&board[ny]&&board[ny][nx])return false;
    }
  return true;
}
function rotate(s){
  const rows=s.length,cols=s[0].length;
  const out=Array.from({length:cols},()=>new Array(rows).fill(0));
  for(let r=0;r<rows;r++)for(let col=0;col<cols;col++)out[col][rows-1-r]=s[r][col];
  return out;
}
function lock(){
  cur.s.forEach((row,r)=>row.forEach((v,col)=>{
    if(v&&curY+r>=0) board[curY+r][curX+col]=cur.c;
  }));
  clearLines(); spawn();
}
function clearLines(){
  let cleared=0;
  for(let r=ROWS-1;r>=0;r--){
    if(board[r].every(c=>c)){
      board.splice(r,1); board.unshift(new Array(COLS).fill(null));
      cleared++; r++;
    }
  }
  if(cleared){
    const pts=[0,100,300,600,1000][cleared]*level;
    score+=pts; lines+=cleared;
    level=Math.floor(lines/10)+1;
    dropInterval=Math.max(120,800-(level-1)*70);
    updateHUD();
    flash.style.opacity='1';
    setTimeout(()=>flash.style.opacity='0',120);
  }
}
function updateHUD(){
  scoreEl.textContent=score; linesEl.textContent=lines; levelEl.textContent=level;
}
function hardDrop(){
  while(canPlace(cur.s,curX,curY+1))curY++;
  lock();
}
function gameOver(){
  state='over';
  overlay.innerHTML=`<h2>💥 Game Over!</h2><div class="sc">Score: ${score}</div><div class="sc" style="font-size:15px">Lines: ${lines}</div><div class="sub">Tap to Try Again</div>`;
  overlay.style.display='flex';
}
document.getElementById('bleft').addEventListener('mousedown',e=>{e.preventDefault();if(state==='playing'&&canPlace(cur.s,curX-1,curY))curX--;});
document.getElementById('bleft').addEventListener('touchstart',e=>{e.preventDefault();if(state==='playing'&&canPlace(cur.s,curX-1,curY))curX--;},{passive:false});
document.getElementById('bright').addEventListener('mousedown',e=>{e.preventDefault();if(state==='playing'&&canPlace(cur.s,curX+1,curY))curX++;});
document.getElementById('bright').addEventListener('touchstart',e=>{e.preventDefault();if(state==='playing'&&canPlace(cur.s,curX+1,curY))curX++;},{passive:false});
document.getElementById('brot').addEventListener('mousedown',e=>{
  e.preventDefault();if(state!=='playing')return;
  const r=rotate(cur.s);
  if(canPlace(r,curX,curY))cur.s=r;
  else if(canPlace(r,curX-1,curY)){cur.s=r;curX--;}
  else if(canPlace(r,curX+1,curY)){cur.s=r;curX++;}
});
document.getElementById('brot').addEventListener('touchstart',e=>{
  e.preventDefault();if(state!=='playing')return;
  const r=rotate(cur.s);
  if(canPlace(r,curX,curY))cur.s=r;
  else if(canPlace(r,curX-1,curY)){cur.s=r;curX--;}
  else if(canPlace(r,curX+1,curY)){cur.s=r;curX++;}
},{passive:false});
document.getElementById('bdrop').addEventListener('mousedown',e=>{e.preventDefault();if(state==='playing')hardDrop();});
document.getElementById('bdrop').addEventListener('touchstart',e=>{e.preventDefault();if(state==='playing')hardDrop();},{passive:false});
overlay.addEventListener('click',()=>{if(state!=='playing')start();});
overlay.addEventListener('touchstart',e=>{e.preventDefault();if(state!=='playing')start();},{passive:false});
function ghostY(){let gy=curY;while(canPlace(cur.s,curX,gy+1))gy++;return gy;}
function drawBlock(ctx2,x,y,color,sz){
  ctx2.fillStyle=color;
  rRect(ctx2, x*sz+1,y*sz+1,sz-2,sz-2,4); ctx2.fill();
  ctx2.fillStyle='rgba(255,255,255,0.35)';
  rRect(ctx2, x*sz+3,y*sz+3,sz-6,Math.round(sz*0.35),3); ctx2.fill();
  ctx2.fillStyle='rgba(0,0,0,0.12)';
  rRect(ctx2, x*sz+1,y*sz+sz-4,sz-2,3, 4); ctx2.fill();
}
function drawNext(){
  nctx.fillStyle='#fafafa'; nctx.fillRect(0,0,68,60);
  if(!nxt)return;
  const nsz=12;
  const ox=Math.floor((5-nxt.s[0].length)/2);
  const oy=Math.floor((4-nxt.s.length)/2);
  nxt.s.forEach((row,r)=>row.forEach((v,col)=>{if(v)drawBlock(nctx,ox+col,oy+r,nxt.c,nsz);}));
}
function draw(){
  const bg=ctx.createLinearGradient(0,0,0,CH);
  bg.addColorStop(0,'#f3e5f5'); bg.addColorStop(1,'#e8f5e9');
  ctx.fillStyle=bg; ctx.fillRect(0,0,CW,CH);
  ctx.fillStyle='rgba(0,0,0,0.04)';
  for(let r=0;r<ROWS;r++) ctx.fillRect(0,r*SZ,CW,1);
  for(let col=0;col<COLS;col++) ctx.fillRect(col*SZ,0,1,CH);
  board.forEach((row,r)=>row.forEach((color,col)=>{if(color)drawBlock(ctx,col,r,color,SZ);}));
  if(state==='playing'){
    const gy=ghostY();
    ctx.globalAlpha=0.2;
    cur.s.forEach((row,r)=>row.forEach((v,col)=>{if(v&&curY+r>=0)drawBlock(ctx,curX+col,gy+r,cur.c,SZ);}));
    ctx.globalAlpha=1;
    cur.s.forEach((row,r)=>row.forEach((v,col)=>{if(v&&curY+r>=0)drawBlock(ctx,curX+col,curY+r,cur.c,SZ);}));
  }
}
let lastTime = 0;
function loop(currentTime){
  if(!lastTime) lastTime = currentTime;
  const dt = currentTime - lastTime;
  lastTime = currentTime;
  if(state==='playing'){
    dropTimer+=dt;
    if(dropTimer>=dropInterval){
      dropTimer=0;
      if(canPlace(cur.s,curX,curY+1))curY++;
      else lock();
    }
  }
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
